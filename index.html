<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Capital Flow</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Fuentes Premium (Serif y Sans-Serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          colors: {
            cream: '#f9f8f4',
            navy: '#1c212d',
            navyLight: '#2a3041',
            forest: '#347b59',
            forestLight: '#429b70',
            lime: '#b4d374', // Color de pestaña activa
            danger: '#e74c3c'
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #f9f8f4; }
    /* Ocultar scroll */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans text-navy pb-24">

  <!-- Cabecera -->
  <header class="p-5 flex justify-between items-center z-10 bg-cream sticky top-0">
    <div>
      <p class="text-[10px] text-gray-500 font-medium uppercase tracking-wider mb-1">Finanzas / Espacio Personal</p>
      <h1 id="header-title" class="text-2xl font-serif font-semibold">Buenos días</h1>
    </div>
    
    <div class="flex items-center gap-3">
      <!-- BOTÓN OCULTO CSV: Parece de ajustes, pero es el input file -->
      <label for="csv-upload" class="w-10 h-10 rounded-full border border-gray-300 flex items-center justify-center text-gray-600 cursor-pointer bg-white shadow-sm hover:bg-gray-50 transition">
        <i class="fa-solid fa-sliders"></i>
        <input type="file" id="csv-upload" class="hidden" accept=".csv" onchange="alert('¡Botón CSV oculto encontrado! Aquí importaremos el Excel.')" />
      </label>
      
      <!-- Icono de Usuario -->
      <div class="w-10 h-10 rounded-full bg-forest flex items-center justify-center text-white font-bold text-sm shadow-sm">
        CF
      </div>
    </div>
  </header>

  <!-- Contenido Principal Dinámico -->
  <main class="flex-1 px-5" id="main-content">
    <!-- El contenido inicial se carga por JS (Resumen) -->
  </main>

  <!-- Barra de Navegación Inferior Estilo App -->
  <nav class="fixed bottom-0 w-full bg-navy text-gray-400 flex justify-between items-center px-4 py-3 pb-5 z-50">
    
    <button onclick="changeTab('resumen', this)" class="nav-item flex flex-col items-center transition-colors w-14 text-lime">
      <i class="fa-solid fa-house text-lg mb-1.5"></i>
      <span class="text-[9px] font-semibold tracking-wide">Resumen</span>
    </button>

    <button onclick="changeTab('caja', this)" class="nav-item flex flex-col items-center transition-colors w-14 hover:text-gray-200">
      <i class="fa-solid fa-wallet text-lg mb-1.5"></i>
      <span class="text-[9px] font-semibold tracking-wide">Caja diaria</span>
    </button>
    
    <button onclick="changeTab('operaciones', this)" class="nav-item flex flex-col items-center transition-colors w-14 hover:text-gray-200">
      <i class="fa-solid fa-arrow-trend-up text-lg mb-1.5"></i>
      <span class="text-[9px] font-semibold tracking-wide">Operaciones</span>
    </button>

    <button onclick="changeTab('cartera', this)" class="nav-item flex flex-col items-center transition-colors w-14 hover:text-gray-200">
      <i class="fa-solid fa-suitcase text-lg mb-1.5"></i>
      <span class="text-[9px] font-semibold tracking-wide">Cartera</span>
    </button>
    
    <button onclick="changeTab('metricas', this)" class="nav-item flex flex-col items-center transition-colors w-14 hover:text-gray-200">
      <i class="fa-solid fa-chart-simple text-lg mb-1.5"></i>
      <span class="text-[9px] font-semibold tracking-wide">Métricas</span>
    </button>
  </nav>

  <script>
    // Fechas dinámicas para la UI
    const meses = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
    const fechaActual = new Date();
    const mesActualText = `${meses[fechaActual.getMonth()]} DE ${fechaActual.getFullYear()}`;

    // Diccionario con el HTML de cada pantalla según tus capturas
    const views = {
      'resumen': `
        <div class="animate-[fadeIn_0.3s_ease-out] space-y-6">
          <div>
            <p class="text-[10px] font-bold text-forest tracking-widest uppercase mb-2">${mesActualText}</p>
            <h2 class="font-serif text-4xl leading-[1.1] text-navy mb-3 tracking-tight">Tu dinero, en perspectiva.</h2>
            <p class="text-sm text-gray-600 leading-relaxed">Una lectura breve de lo que entró, lo que salió y lo que estás construyendo.</p>
          </div>
          
          <button class="bg-forest text-white px-5 py-3 rounded-xl font-medium flex items-center gap-2 hover:bg-forestLight transition shadow-sm">
            <i class="fa-solid fa-plus"></i> Añadir movimiento
          </button>

          <!-- Tarjeta Balance Mes -->
          <div class="bg-navyLight text-white p-6 rounded-[2rem] shadow-md relative overflow-hidden">
            <!-- Círculos decorativos de fondo -->
            <div class="absolute -right-10 -bottom-10 w-48 h-48 border-[15px] border-white/5 rounded-full"></div>
            <div class="absolute -right-20 -bottom-20 w-64 h-64 border-[15px] border-white/5 rounded-full"></div>
            
            <p class="text-[10px] font-bold text-lime tracking-widest uppercase mb-2 relative z-10">BALANCE DEL MES</p>
            <h3 class="font-serif text-3xl mb-4 relative z-10 w-3/4 leading-snug">Lo que queda después de vivir.</h3>
            <p class="text-3xl font-medium mb-1 relative z-10">$0,00</p>
            <p class="text-xs text-gray-400 relative z-10">0 movimientos registrados · ritmo positivo</p>
          </div>

          <!-- Tarjetas Blancas (Ingresos, Gastos, Patrimonio) -->
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-start">
            <div>
              <p class="text-xs text-gray-500 mb-2">Ingresos</p>
              <p class="text-2xl font-semibold text-forest mb-1">$0,00</p>
              <p class="text-xs text-gray-400">este mes</p>
            </div>
            <i class="fa-solid fa-arrow-down-left text-forest text-sm bg-green-50 p-1.5 rounded-md"></i>
          </div>

          <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-start">
            <div>
              <p class="text-xs text-gray-500 mb-2">Gastos</p>
              <p class="text-2xl font-semibold text-danger mb-1">$0,00</p>
              <p class="text-xs text-gray-400">este mes</p>
            </div>
            <i class="fa-solid fa-arrow-up-right text-danger text-sm bg-red-50 p-1.5 rounded-md"></i>
          </div>
        </div>
      `,
      
      'caja': `
        <div class="animate-[fadeIn_0.3s_ease-out] space-y-6">
          <div>
            <p class="text-[10px] font-bold text-forest tracking-widest uppercase mb-2">CAJA DIARIA</p>
            <h2 class="font-serif text-4xl leading-[1.1] text-navy mb-3 tracking-tight">Que el dinero tenga contexto.</h2>
            <p class="text-sm text-gray-600 leading-relaxed">Anota ingresos y gastos sin convertir tu vida en una planilla. Cada movimiento cuenta una parte de la historia.</p>
          </div>
          
          <button class="bg-forest text-white px-5 py-3 rounded-xl font-medium flex items-center gap-2 hover:bg-forestLight transition shadow-sm">
            <i class="fa-solid fa-plus"></i> Nuevo movimiento
          </button>

          <!-- Estado Vacío -->
          <div class="mt-12 flex flex-col items-center justify-center text-center">
            <div class="w-16 h-16 bg-white rounded-2xl shadow-sm border border-gray-100 flex items-center justify-center text-forest text-2xl mb-4">
              <i class="fa-solid fa-wallet"></i>
            </div>
            <h4 class="font-bold text-navy mb-2">Todavía no hay movimientos</h4>
            <p class="text-sm text-gray-500 max-w-xs">Registra tu primer ingreso o gasto para empezar a ver el pulso de tu caja.</p>
          </div>
        </div>
      `,

      'operaciones': `
        <div class="animate-[fadeIn_0.3s_ease-out] space-y-6">
          <div>
            <p class="text-[10px] font-bold text-forest tracking-widest uppercase mb-2">OPERACIONES</p>
            <h2 class="font-serif text-4xl leading-[1.1] text-navy mb-3 tracking-tight">Cada decisión deja una huella.</h2>
            <p class="text-sm text-gray-600 leading-relaxed">Un historial limpio para entender cuánto capital pusiste, cuánto fluyó y qué intereses volvió a traer.</p>
          </div>
          
          <button class="bg-forest text-white px-5 py-3 rounded-xl font-medium flex items-center gap-2 hover:bg-forestLight transition shadow-sm">
            <i class="fa-solid fa-plus"></i> Nueva operación
          </button>

          <div class="grid grid-cols-1 gap-3">
             <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
              <p class="text-xs text-gray-500 mb-2">Capital comprado</p>
              <p class="text-2xl font-semibold text-navy mb-1">$0,00</p>
              <p class="text-xs text-gray-400">operaciones de compra</p>
            </div>
          </div>
        </div>
      `,

      'cartera': `
        <div class="animate-[fadeIn_0.3s_ease-out] space-y-6">
          <div>
            <p class="text-[10px] font-bold text-forest tracking-widest uppercase mb-2">CARTERA</p>
            <h2 class="font-serif text-4xl leading-[1.1] text-navy mb-3 tracking-tight">Lo que estás construyendo.</h2>
            <p class="text-sm text-gray-600 leading-relaxed">Posiciones consolidadas desde tus operaciones, con precio medio y una lectura honesta de lo que hoy valen.</p>
          </div>
          
          <button class="bg-forest text-white px-5 py-3 rounded-xl font-medium flex items-center gap-2 hover:bg-forestLight transition shadow-sm">
            <i class="fa-solid fa-plus"></i> Registrar operación
          </button>

          <div class="grid grid-cols-1 gap-3">
             <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
              <p class="text-xs text-gray-500 mb-2">Capital invertido</p>
              <p class="text-2xl font-semibold text-navy mb-1">$0,00</p>
              <p class="text-xs text-gray-400">0 posiciones</p>
            </div>
          </div>
        </div>
      `,

      'metricas': `
        <div class="animate-[fadeIn_0.3s_ease-out] space-y-6">
          <div>
            <p class="text-[10px] font-bold text-forest tracking-widest uppercase mb-2">MÉTRICAS / HISTÓRICO</p>
            <h2 class="font-serif text-4xl leading-[1.1] text-navy mb-3 tracking-tight">El tiempo también compone.</h2>
            <p class="text-sm text-gray-600 leading-relaxed">Mira el ritmo de tus ingresos, gastos, aportaciones e intereses sin perder de vista el conjunto.</p>
          </div>

          <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 h-64 flex flex-col justify-between">
            <div>
               <h3 class="font-bold text-navy">Ingresos vs gastos</h3>
               <div class="flex gap-4 mt-2">
                 <span class="text-xs text-gray-500"><span class="inline-block w-2 h-2 rounded-full bg-forest mr-1"></span>Ingresos</span>
                 <span class="text-xs text-gray-500"><span class="inline-block w-2 h-2 rounded-full bg-orange-400 mr-1"></span>Gastos</span>
               </div>
            </div>
            <div class="flex-1 flex items-center justify-center mt-4 border-b-2 border-gray-100">
               <p class="text-xs text-gray-300">Aquí irá el gráfico</p>
            </div>
          </div>
        </div>
      `
    };

    const headerTitles = {
      'resumen': 'Buenos días',
      'caja': 'Caja diaria',
      'operaciones': 'Operaciones',
      'cartera': 'Cartera',
      'metricas': 'Métricas'
    };

    function changeTab(tabName, element) {
      // 1. Quitar color activo a todos los botones de navegación
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('text-lime');
        item.classList.add('text-gray-400', 'hover:text-gray-200');
      });
      
      // 2. Aplicar color activo (verde lima claro) al seleccionado
      element.classList.remove('text-gray-400', 'hover:text-gray-200');
      element.classList.add('text-lime');

      // 3. Cambiar el título de la cabecera arriba a la izquierda
      document.getElementById('header-title').innerText = headerTitles[tabName];

      // 4. Inyectar el HTML de la vista correspondiente
      document.getElementById('main-content').innerHTML = views[tabName];
    }

    // Inicializar la app mostrando el Resumen
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('main-content').innerHTML = views['resumen'];
    });
  </script>
</body>
</html>
