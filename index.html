<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mi App Financiera</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* Tema 1: Pro Trader (Azul/Celeste) */
    :root {
      --bg-main: #0f172a;      
      --bg-card: #1e293b;      
      --accent: #06b6d4;       
      --text-main: #f8fafc;    
      --text-muted: #94a3b8;   
      --color-up: #22c55e;     
      --color-down: #ef4444;   
    }

    /* Tema 2: Premium Wealth (Gris/Dorado) */
    body.theme-premium {
      --bg-main: #1f2229;      
      --bg-card: #2a2e37;      
      --accent: #f59e0b;       
      --text-main: #fffff0;    
      --text-muted: #9ca3af;   
      --color-up: #65a30d;     
      --color-down: #be123c;   
    }

    /* Tema 3: Adaptive Tech (Negro puro/Violeta) inspirado en interfaces web modernas */
    body.theme-adaptive {
      --bg-main: #09090b;      
      --bg-card: #18181b;      
      --accent: #8b5cf6;       
      --text-main: #fafafa;    
      --text-muted: #a1a1aa;   
      --color-up: #10b981;     
      --color-down: #f43f5e;   
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.3s, color 0.3s;
    }
    
    .bg-card { background-color: var(--bg-card); transition: background-color 0.3s; }
    .text-muted { color: var(--text-muted); }
    .text-accent { color: var(--accent); }
    .bg-accent { background-color: var(--accent); }
    .border-accent { border-color: var(--accent); }
    
    /* Botón flotante abajo a la derecha */
    .fab-button {
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: transform 0.2s;
    }
    .fab-button:active { transform: scale(0.95); }

    /* Ocultar barra de scroll para que parezca una app nativa */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans pb-20 relative">

  <!-- Cabecera -->
  <header class="p-5 flex justify-between items-start bg-card shadow-md rounded-b-3xl z-10 relative">
    <div class="pr-4">
      <h1 class="text-2xl font-bold tracking-wide mb-1">Mi Portafolio</h1>
      <p class="text-xs text-muted italic font-medium leading-relaxed">
        "La riqueza es el resultado de pequeñas decisiones consistentes tomadas a lo largo del tiempo."
      </p>
    </div>
    
    <div class="flex flex-col items-center gap-4">
      <!-- Botón de paleta de temas -->
      <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-accent flex items-center justify-center text-white shrink-0 shadow-lg">
        <i class="fa-solid fa-palette"></i>
      </button>

      <!-- Botón OCULTO de Carga Masiva CSV -->
      <!-- Es transparente y solo se nota si sabés que está ahí -->
      <label for="csv-upload" class="cursor-pointer opacity-10 hover:opacity-100 transition-opacity">
        <i class="fa-solid fa-file-csv text-xl text-muted"></i>
        <input type="file" id="csv-upload" class="hidden" accept=".csv" onchange="alert('¡Has encontrado el botón oculto! Aquí conectaremos la función de Excel.')" />
      </label>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 p-5 overflow-y-auto" id="main-content">
    
    <!-- PESTAÑA: RESUMEN (Por defecto) -->
    <div class="animate-[fadeIn_0.3s_ease-out] space-y-6">
      
      <!-- Tarjeta de Balance principal -->
      <div class="bg-card p-6 rounded-3xl shadow-lg border-l-4 border-accent relative overflow-hidden">
        <div class="absolute -right-6 -top-6 text-accent opacity-10 text-9xl">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <h2 class="text-sm font-semibold text-muted uppercase tracking-wider mb-2 relative z-10">Balance Consolidado</h2>
        <p class="text-4xl font-bold text-accent relative z-10">$0.00</p>
      </div>

      <!-- Tarjetas de Acceso Rápido tipo panel -->
      <div class="grid grid-cols-2 gap-4">
        <button onclick="document.getElementById('nav-caja').click()" class="bg-card p-4 rounded-2xl flex flex-col items-center justify-center gap-2 shadow-sm active:scale-95 transition-transform">
          <div class="w-12 h-12 rounded-full bg-accent/10 text-accent flex items-center justify-center text-xl">
            <i class="fa-solid fa-money-bill-transfer"></i>
          </div>
          <span class="text-sm font-semibold text-muted">Ir a Caja</span>
        </button>

        <button onclick="document.getElementById('nav-operaciones').click()" class="bg-card p-4 rounded-2xl flex flex-col items-center justify-center gap-2 shadow-sm active:scale-95 transition-transform">
          <div class="w-12 h-12 rounded-full bg-accent/10 text-accent flex items-center justify-center text-xl">
            <i class="fa-solid fa-arrow-trend-up"></i>
          </div>
          <span class="text-sm font-semibold text-muted">Ir a Operaciones</span>
        </button>
      </div>
      
    </div>
  </main>

  <!-- Botón Flotante (Carga Rápida) abajo a la derecha -->
  <button onclick="alert('Este botón centralizará las altas rápidas (ingresos, gastos o compras)')" class="fab-button fixed bottom-24 right-6 w-14 h-14 rounded-full bg-accent flex items-center justify-center text-white text-2xl z-50">
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- Barra de Navegación Inferior (5 Pestañas) -->
  <nav class="fixed bottom-0 w-full bg-card shadow-[0_-5px_15px_rgba(0,0,0,0.3)] flex justify-between items-center px-4 py-3 rounded-t-3xl z-40">
    
    <button id="nav-resumen" onclick="changeTab('resumen', this)" class="nav-item flex flex-col items-center text-accent transition-colors w-14">
      <i class="fa-solid fa-house text-xl mb-1"></i>
      <span class="text-[9px] font-bold uppercase tracking-wide">Resumen</span>
    </button>

    <button id="nav-caja" onclick="changeTab('caja', this)" class="nav-item flex flex-col items-center text-muted transition-colors w-14">
      <i class="fa-solid fa-money-bill-transfer text-xl mb-1"></i>
      <span class="text-[9px] font-bold uppercase tracking-wide">Caja</span>
    </button>
    
    <button id="nav-operaciones" onclick="changeTab('operaciones', this)" class="nav-item flex flex-col items-center text-muted transition-colors w-14">
      <i class="fa-solid fa-arrow-trend-up text-xl mb-1"></i>
      <span class="text-[9px] font-bold uppercase tracking-wide">Operar</span>
    </button>

    <button id="nav-cartera" onclick="changeTab('cartera', this)" class="nav-item flex flex-col items-center text-muted transition-colors w-14">
      <i class="fa-solid fa-pie-chart text-xl mb-1"></i>
      <span class="text-[9px] font-bold uppercase tracking-wide">Cartera</span>
    </button>
    
    <button id="nav-metricas" onclick="changeTab('metricas', this)" class="nav-item flex flex-col items-center text-muted transition-colors w-14">
      <i class="fa-solid fa-chart-simple text-xl mb-1"></i>
      <span class="text-[9px] font-bold uppercase tracking-wide">Métricas</span>
    </button>
  </nav>

  <script>
    let currentTheme = 1;

    function toggleTheme() {
      const body = document.body;
      body.classList.remove('theme-premium', 'theme-adaptive');
      currentTheme++;
      
      // Rotar entre 1, 2 y 3
      if (currentTheme === 2) {
        body.classList.add('theme-premium');
      } else if (currentTheme === 3) {
        body.classList.add('theme-adaptive');
      } else {
        currentTheme = 1; 
      }
    }

    function changeTab(tabName, element) {
      // Quitar estilo activo a todos
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('text-accent');
        item.classList.add('text-muted');
      });
      
      // Aplicar estilo activo al botón tocado
      element.classList.remove('text-muted');
      element.classList.add('text-accent');

      const content = document.getElementById('main-content');
      
      if(tabName === 'resumen') {
        content.innerHTML = `
          <div class="animate-[fadeIn_0.3s_ease-out] space-y-6">
            <div class="bg-card p-6 rounded-3xl shadow-lg border-l-4 border-accent relative overflow-hidden">
              <div class="absolute -right-6 -top-6 text-accent opacity-10 text-9xl">
                <i class="fa-solid fa-wallet"></i>
              </div>
              <h2 class="text-sm font-semibold text-muted uppercase tracking-wider mb-2 relative z-10">Balance Consolidado</h2>
              <p class="text-4xl font-bold text-accent relative z-10">$0.00</p>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <button onclick="document.getElementById('nav-caja').click()" class="bg-card p-4 rounded-2xl flex flex-col items-center justify-center gap-2 shadow-sm">
                <div class="w-12 h-12 rounded-full bg-accent/10 text-accent flex items-center justify-center text-xl"><i class="fa-solid fa-money-bill-transfer"></i></div>
                <span class="text-sm font-semibold text-muted">Ir a Caja</span>
              </button>
              <button onclick="document.getElementById('nav-operaciones').click()" class="bg-card p-4 rounded-2xl flex flex-col items-center justify-center gap-2 shadow-sm">
                <div class="w-12 h-12 rounded-full bg-accent/10 text-accent flex items-center justify-center text-xl"><i class="fa-solid fa-arrow-trend-up"></i></div>
                <span class="text-sm font-semibold text-muted">Ir a Operaciones</span>
              </button>
            </div>
          </div>
        `;
      } else {
        content.innerHTML = `
          <div class="flex flex-col items-center justify-center h-64 text-center animate-[fadeIn_0.3s_ease-out]">
            <h2 class="text-xl font-semibold mb-2">Pantalla: ${tabName.toUpperCase()}</h2>
            <p class="text-muted text-sm">Aquí integraremos tu base de datos de ${tabName}.</p>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
