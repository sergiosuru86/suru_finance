<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Capital Flow</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  
  <!-- LIBRERÍA DE GRÁFICOS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* TEMAS DE COLORES */
    :root {
      --bg-body: #f9f8f4; --bg-card: #ffffff; --bg-nav: #1c212d; --bg-hero: #2a3041;
      --text-main: #1c212d; --text-muted: #6b7280; --accent: #347b59; --up-color: #347b59;
      --down-color: #e74c3c; --card-border: #f3f4f6; --nav-active: #b4d374; --nav-inactive: #9ca3af;
    }
    body.theme-pro {
      --bg-body: #0f172a; --bg-card: #1e293b; --bg-nav: #020617; --bg-hero: #0ea5e9;
      --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #06b6d4; --up-color: #22c55e;
      --down-color: #ef4444; --card-border: #334155; --nav-active: #06b6d4; --nav-inactive: #64748b;
    }
    body.theme-premium {
      --bg-body: #1f2229; --bg-card: #2a2e37; --bg-nav: #111317; --bg-hero: #b45309;
      --text-main: #fffff0; --text-muted: #9ca3af; --accent: #f59e0b; --up-color: #65a30d;
      --down-color: #be123c; --card-border: #374151; --nav-active: #fcd34d; --nav-inactive: #6b7280;
    }
    body.theme-adaptive {
      --bg-body: #09090b; --bg-card: #18181b; --bg-nav: #000000; --bg-hero: #6d28d9;
      --text-main: #fafafa; --text-muted: #a1a1aa; --accent: #8b5cf6; --up-color: #10b981;
      --down-color: #f43f5e; --card-border: #27272a; --nav-active: #c4b5fd; --nav-inactive: #52525b;
    }

    body { background-color: var(--bg-body); color: var(--text-main); transition: background-color 0.3s, color 0.3s; }
    .nav-item.active { color: var(--nav-active); }
    .nav-item:not(.active) { color: var(--nav-inactive); }
    .nav-item:not(.active):hover { opacity: 0.8; }
    ::-webkit-scrollbar { display: none; }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
          colors: {
            vbody: 'var(--bg-body)', vcard: 'var(--bg-card)', vnav: 'var(--bg-nav)',
            vhero: 'var(--bg-hero)', vmain: 'var(--text-main)', vmuted: 'var(--text-muted)',
            vaccent: 'var(--accent)', vup: 'var(--up-color)', vdown: 'var(--down-color)',
            vborder: 'var(--card-border)'
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex flex-col font-sans pb-24 relative transition-colors duration-300">

  <header class="p-5 flex justify-between items-center z-10 bg-vbody sticky top-0 transition-colors duration-300">
    <div>
      <p class="text-[10px] text-vmuted font-medium uppercase tracking-wider mb-1">Finanzas / Espacio Personal</p>
      <h1 id="header-title" class="text-2xl font-serif font-semibold text-vmain">Buenos días</h1>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="toggleTheme()" class="w-10 h-10 rounded-full border border-vborder flex items-center justify-center text-vmuted bg-vcard shadow-sm active:scale-95 transition-transform">
        <i class="fa-solid fa-palette"></i>
      </button>
      <label for="csv-upload" class="w-10 h-10 rounded-full border border-vborder flex items-center justify-center text-vmuted cursor-pointer bg-vcard shadow-sm active:scale-95 transition-transform">
        <i class="fa-solid fa-sliders"></i>
        <input type="file" id="csv-upload" class="hidden" accept=".csv" onchange="importarCSV(event)" />
      </label>
      <div class="w-10 h-10 rounded-full bg-vaccent flex items-center justify-center text-white font-bold text-sm shadow-sm">CF</div>
    </div>
  </header>

  <main class="flex-1 px-5" id="main-content"></main>

  <!-- MODAL: NUEVA CAJA DIARIA -->
  <div id="modal-caja" class="fixed inset-0 bg-black/60 z-[100] hidden flex-col justify-end sm:justify-center items-center transition-opacity">
    <div class="bg-vcard w-full sm:w-96 rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-[slideUp_0.3s_ease-out]">
      <div class="flex justify-between items-center mb-6">
        <h3 class="font-serif text-2xl font-semibold text-vmain">Nuevo Movimiento</h3>
        <button onclick="closeModal('modal-caja')" class="text-vmuted hover:text-vdown text-xl"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="guardarMovimiento(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-vmuted uppercase mb-1">Tipo</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="tipo-mov" value="Ingreso" class="peer hidden" checked>
              <div class="text-center p-3 rounded-xl border border-vborder text-vmuted peer-checked:bg-vup/10 peer-checked:text-vup peer-checked:border-vup transition-all font-medium">Ingreso</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="tipo-mov" value="Gasto" class="peer hidden">
              <div class="text-center p-3 rounded-xl border border-vborder text-vmuted peer-checked:bg-vdown/10 peer-checked:text-vdown peer-checked:border-vdown transition-all font-medium">Gasto</div>
            </label>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-vmuted uppercase mb-1">Fecha</label>
          <input type="date" id="caja-fecha" required class="w-full bg-vbody text-vmain border border-vborder rounded-xl p-3 outline-none focus:border-vaccent" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-vmuted uppercase mb-1">Descripción</label>
          <input type="text" id="caja-desc" required placeholder="Ej: Venta de piezas 3D" class="w-full bg-vbody text-vmain border border-vborder rounded-xl p-3 outline-none focus:border-vaccent" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-vmuted uppercase mb-1">Monto ($)</label>
          <input type="number" step="any" id="caja-monto" required placeholder="0.00" class="w-full bg-vbody text-vmain border border-vborder rounded-xl p-3 outline-none focus:border-vaccent text-lg font-bold" />
        </div>
        <button type="submit" class="w-full bg-vaccent text-white font-semibold py-4 rounded-xl shadow-md active:scale-95 transition-transform mt-2">Guardar</button>
      </form>
    </div>
  </div>

  <!-- MODAL: NUEVA OPERACIÓN -->
  <div id="modal-operacion" class="fixed inset-0 bg-black/60 z-[100] hidden flex-col justify-end sm:justify-center items-center transition-opacity max-h-screen overflow-y-auto pt-20">
    <div class="bg-vcard w-full sm:w-[400px] rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-[slideUp_0.3s_ease-out] mb-10">
      <div class="flex justify-between items-center mb-6">
        <h3 class="font-serif text-2xl font-semibold text-vmain">Registrar Operación</h3>
        <button onclick="closeModal('modal-operacion')" class="text-vmuted hover:text-vdown text-xl"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="guardarOperacion(event)" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-vmuted uppercase mb-1">Fecha</label>
            <input type="date" id="op-fecha" required class="w-full bg-vbody text-vmain border border-vborder rounded-xl p-2.5 outline-none focus:border-vaccent" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-vmuted uppercase mb-1">Activo (Ticker)</label>
            <input type="text" id="op-activo" required placeholder="Ej: AAPL" class="w-full bg-vbody text-vmain border border-vborder rounded-xl p-2.5 outline-none focus:border-vaccent uppercase" />
          </div>
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-vmuted uppercase mb-1">Tipo</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="op-tipo" value="Compra" class="peer hidden" checked>
              <div class="text-center p-2.5 rounded-xl border border-vborder text-vmuted peer-checked:bg-vhero peer-checked:text-white peer-checked:border-vhero transition-all font-medium">Compra</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="op-tipo" value="Venta" class="peer hidden">
              <div class="text-center p-2.5 rounded-xl border border-vborder text-vmuted peer-checked:bg-vnav peer-checked:text-white peer-checked:border-vnav transition-all font-medium">Venta</div>
            </label>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-xs font-semibold text-vmuted uppercase mb-1">Cantidad</label><input type="number" step="any" id="op-cantidad" required placeholder="0" class="w-full bg-vbody text-vmain border border-vborder rounded-xl p-2.5 outline-none focus:border-vaccent" /></div>
          <div><label class="block text-xs font-semibold text-vmuted uppercase mb-1">Precio Unit.</label><input type="number" step="any" id="op-precio" required placeholder="0.00" class="w-full bg-vbody text-vmain border border-vborder rounded-xl p-2.5 outline-none focus:border-vaccent" /></div>
          <div><label class="block text-xs font-semibold text-vmuted uppercase mb-1">Comisión</label><input type="number" step="any" id="op-comision" value="0" class="w-full bg-vbody text-vmain border border-vborder rounded-xl p-2.5 outline-none focus:border-vaccent" /></div>
          <div><label class="block text-xs font-semibold text-vmuted uppercase mb-1">Intereses</label><input type="number" step="any" id="op-interes" value="0" class="w-full bg-vbody text-vmain border border-vborder rounded-xl p-2.5 outline-none focus:border-vaccent" /></div>
        </div>
        <button type="submit" class="w-full bg-vaccent text-white font-semibold py-4 rounded-xl shadow-md active:scale-95 transition-transform mt-2">Guardar Operación</button>
      </form>
    </div>
  </div>

  <nav class="fixed bottom-0 w-full bg-vnav flex justify-between items-center px-4 py-3 pb-5 z-50 transition-colors duration-300">
    <button onclick="changeTab('resumen', this)" class="nav-item active flex flex-col items-center transition-colors w-14"><i class="fa-solid fa-house text-lg mb-1.5"></i><span class="text-[9px] font-semibold tracking-wide">Resumen</span></button>
    <button onclick="changeTab('caja', this)" class="nav-item flex flex-col items-center transition-colors w-14"><i class="fa-solid fa-wallet text-lg mb-1.5"></i><span class="text-[9px] font-semibold tracking-wide">Caja</span></button>
    <button onclick="changeTab('operaciones', this)" class="nav-item flex flex-col items-center transition-colors w-14"><i class="fa-solid fa-arrow-trend-up text-lg mb-1.5"></i><span class="text-[9px] font-semibold tracking-wide">Operar</span></button>
    <button onclick="changeTab('cartera', this)" class="nav-item flex flex-col items-center transition-colors w-14"><i class="fa-solid fa-suitcase text-lg mb-1.5"></i><span class="text-[9px] font-semibold tracking-wide">Cartera</span></button>
    <button onclick="changeTab('metricas', this)" class="nav-item flex flex-col items-center transition-colors w-14"><i class="fa-solid fa-chart-simple text-lg mb-1.5"></i><span class="text-[9px] font-semibold tracking-wide">Métricas</span></button>
  </nav>

  <script>
    let db;
    let chartCajaInst = null;
    let chartPieInst = null;
    let chartLineInst = null;

    const request = indexedDB.open("CapitalFlowDB", 2);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("caja")) db.createObjectStore("caja", { keyPath: "id", autoIncrement: true });
      if (!db.objectStoreNames.contains("operaciones")) db.createObjectStore("operaciones", { keyPath: "id", autoIncrement: true });
      if (!db.objectStoreNames.contains("precios")) db.createObjectStore("precios", { keyPath: "ticker" });
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      document.getElementById('caja-fecha').valueAsDate = new Date();
      document.getElementById('op-fecha').valueAsDate = new Date();
      changeTab('resumen', document.querySelector('.nav-item.active'));
    };

    function getAll(store) {
      return new Promise((resolve) => {
        const tx = db.transaction(store, "readonly");
        const req = tx.objectStore(store).getAll();
        req.onsuccess = () => resolve(req.result);
      });
    }
    function addRecord(store, data) { return new Promise((resolve) => { const tx = db.transaction(store, "readwrite"); tx.objectStore(store).add(data); tx.oncomplete = () => resolve(); }); }
    function deleteRecord(store, id) { return new Promise((resolve) => { const tx = db.transaction(store, "readwrite"); tx.objectStore(store).delete(id); tx.oncomplete = () => resolve(); }); }
    function clearStore(store) { return new Promise((resolve) => { const tx = db.transaction(store, "readwrite"); tx.objectStore(store).clear(); tx.oncomplete = () => resolve(); }); }
    function putRecord(store, data) { return new Promise((resolve) => { const tx = db.transaction(store, "readwrite"); tx.objectStore(store).put(data); tx.oncomplete = () => resolve(); }); }

    const themes = ['', 'theme-pro', 'theme-premium', 'theme-adaptive'];
    let currentThemeIndex = 0;
    function toggleTheme() {
      document.body.classList.remove('theme-pro', 'theme-premium', 'theme-adaptive');
      currentThemeIndex = (currentThemeIndex + 1) % themes.length;
      if (themes[currentThemeIndex]) document.body.classList.add(themes[currentThemeIndex]);
      // Si estamos en métricas, redibujar gráficos para que tomen los nuevos colores
      if (document.getElementById('header-title').innerText.includes('Métrica')) updateMetricas();
    }
    
    const meses = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
    const fechaActual = new Date();
    const mesActualText = `${meses[fechaActual.getMonth()]} DE ${fechaActual.getFullYear()}`;
    const mesActualFiltro = fechaActual.toISOString().slice(0, 7);

    function formatMoney(num) { return "$" + num.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function formatCrypto(num) { return parseFloat(num.toFixed(4)).toString(); }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

    const views = {
      'resumen': `
        <div class="animate-[fadeIn_0.3s_ease-out] space-y-6">
          <div><p class="text-[10px] font-bold text-vaccent tracking-widest uppercase mb-2">${mesActualText}</p><h2 class="font-serif text-4xl leading-[1.1] text-vmain mb-3 tracking-tight">Tu dinero, en perspectiva.</h2><p class="text-sm text-vmuted leading-relaxed">Una lectura breve de lo que entró, lo que salió y lo que estás construyendo.</p></div>
          <button onclick="openModal('modal-caja')" class="bg-vaccent text-white px-5 py-3 rounded-xl font-medium flex items-center gap-2 shadow-sm opacity-90 hover:opacity-100 transition-opacity"><i class="fa-solid fa-plus"></i> Añadir movimiento</button>
          
          <div class="bg-vhero text-white p-6 rounded-[2rem] shadow-md relative overflow-hidden transition-colors duration-300">
            <div class="absolute -right-10 -bottom-10 w-48 h-48 border-[15px] border-white/5 rounded-full"></div>
            <p class="text-[10px] font-bold text-[var(--nav-active)] tracking-widest uppercase mb-2 relative z-10">BALANCE DEL MES</p>
            <h3 class="font-serif text-3xl mb-4 relative z-10 w-3/4 leading-snug">Lo que queda después de vivir.</h3>
            <p id="res-balance" class="text-3xl font-medium mb-1 relative z-10">$0.00</p>
            <p id="res-count" class="text-xs text-white/50 relative z-10">0 movimientos registrados</p>
          </div>
          
          <div class="bg-vcard p-5 rounded-2xl shadow-sm border border-vborder flex justify-between items-start transition-colors duration-300">
            <div><p class="text-xs text-vmuted mb-2">Ingresos</p><p id="res-ingresos" class="text-2xl font-semibold text-vup mb-1">$0.00</p><p class="text-xs text-vmuted/70">este mes</p></div><i class="fa-solid fa-arrow-down-left text-vup text-sm bg-vup/10 p-1.5 rounded-md"></i>
          </div>
          <div class="bg-vcard p-5 rounded-2xl shadow-sm border border-vborder flex justify-between items-start transition-colors duration-300">
            <div><p class="text-xs text-vmuted mb-2">Gastos</p><p id="res-gastos" class="text-2xl font-semibold text-vdown mb-1">$0.00</p><p class="text-xs text-vmuted/70">este mes</p></div><i class="fa-solid fa-arrow-up-right text-vdown text-sm bg-vdown/10 p-1.5 rounded-md"></i>
          </div>
        </div>`,
      
      'caja': `
        <div class="animate-[fadeIn_0.3s_ease-out] space-y-6">
          <div><p class="text-[10px] font-bold text-vaccent tracking-widest uppercase mb-2">CAJA DIARIA</p><h2 class="font-serif text-4xl leading-[1.1] text-vmain mb-3 tracking-tight">Que el dinero tenga contexto.</h2><p class="text-sm text-vmuted leading-relaxed">Anota ingresos y gastos sin convertir tu vida en una planilla.</p></div>
          <button onclick="openModal('modal-caja')" class="bg-vaccent text-white px-5 py-3 rounded-xl font-medium flex items-center gap-2 shadow-sm opacity-90 hover:opacity-100 transition-opacity"><i class="fa-solid fa-plus"></i> Nuevo movimiento</button>
          
          <div class="flex justify-between items-center mt-6 mb-2"><h3 class="font-bold text-vmain">Historial del mes</h3><span id="caja-count" class="text-xs text-vmuted bg-vcard px-2 py-1 rounded-md border border-vborder">0 registros</span></div>
          <div id="caja-lista" class="space-y-3 pb-8"></div>
        </div>`,

      'operaciones': `
        <div class="animate-[fadeIn_0.3s_ease-out] space-y-6">
          <div><p class="text-[10px] font-bold text-vaccent tracking-widest uppercase mb-2">OPERACIONES</p><h2 class="font-serif text-4xl leading-[1.1] text-vmain mb-3 tracking-tight">Cada decisión deja una huella.</h2></div>
          <button onclick="openModal('modal-operacion')" class="bg-vaccent text-white px-5 py-3 rounded-xl font-medium flex items-center gap-2 shadow-sm opacity-90 hover:opacity-100 transition-opacity"><i class="fa-solid fa-plus"></i> Nueva operación</button>

          <div class="grid grid-cols-1 gap-3">
             <div class="bg-vcard p-5 rounded-2xl shadow-sm border border-vborder transition-colors"><p class="text-xs text-vmuted mb-2">Capital comprado</p><p id="op-capital" class="text-2xl font-semibold text-vmain mb-1">$0.00</p><p class="text-xs text-vmuted/70">operaciones de compra</p></div>
             <div class="bg-vcard p-5 rounded-2xl shadow-sm border border-vborder transition-colors"><p class="text-xs text-vmuted mb-2">Flujo neto</p><p id="op-flujo" class="text-2xl font-semibold text-vmain mb-1">$0.00</p><p class="text-xs text-vmuted/70">compras y ventas</p></div>
             <div class="bg-vcard p-5 rounded-2xl shadow-sm border border-vborder transition-colors"><p class="text-xs text-vmuted mb-2">Intereses / Dividendos</p><p id="op-interes" class="text-2xl font-semibold text-vup mb-1">$0.00</p><p class="text-xs text-vmuted/70">acumulados</p></div>
          </div>
          
          <div class="flex justify-between items-center mt-6 mb-2">
            <h3 class="font-bold text-vmain">Historial de operaciones</h3>
            <button onclick="vaciarOperaciones()" class="text-vdown text-sm hover:opacity-70"><i class="fa-solid fa-trash-can"></i></button>
          </div>
          <div id="op-lista" class="space-y-3 pb-8"></div>
        </div>`,

      'cartera': `
        <div class="animate-[fadeIn_0.3s_ease-out] space-y-6">
          <div><p class="text-[10px] font-bold text-vaccent tracking-widest uppercase mb-2">CARTERA</p><h2 class="font-serif text-4xl leading-[1.1] text-vmain mb-3 tracking-tight">Lo que estás construyendo.</h2></div>
          <button onclick="document.querySelector('.nav-item:nth-child(3)').click(); setTimeout(()=>openModal('modal-operacion'), 300);" class="bg-vaccent text-white px-5 py-3 rounded-xl font-medium flex items-center gap-2 shadow-sm opacity-90 hover:opacity-100 transition-opacity"><i class="fa-solid fa-plus"></i> Registrar operación</button>

          <div class="grid grid-cols-1 gap-3">
             <div class="bg-vcard p-5 rounded-2xl shadow-sm border border-vborder transition-colors"><p class="text-xs text-vmuted mb-2">Capital invertido</p><p id="cart-capital" class="text-2xl font-semibold text-vmain mb-1">$0.00</p><p id="cart-pos" class="text-xs text-vmuted/70">0 posiciones</p></div>
             <div class="bg-vcard p-5 rounded-2xl shadow-sm border border-vborder transition-colors"><p class="text-xs text-vmuted mb-2">Valor de mercado</p><p id="cart-valor" class="text-2xl font-semibold text-vmain mb-1">$0.00</p><p class="text-xs text-vmuted/70">con precios actuales</p></div>
             <div class="bg-vcard p-5 rounded-2xl shadow-sm border border-vborder transition-colors"><p class="text-xs text-vmuted mb-2">P/L no realizado</p><p id="cart-pl" class="text-2xl font-semibold text-vmain mb-1">$0.00</p><p class="text-xs text-vmuted/70">rendimiento latente</p></div>
          </div>
          
          <div class="flex justify-between items-center mt-6 mb-2">
            <h3 class="font-bold text-vmain">Posiciones</h3><span class="text-xs text-vmuted">Toca el precio para editar</span>
          </div>
          <div id="cart-lista" class="space-y-4 pb-8"></div>
        </div>`,

      'metricas': `
        <div class="animate-[fadeIn_0.3s_ease-out] space-y-8 pb-10">
          <div>
            <p class="text-[10px] font-bold text-vaccent tracking-widest uppercase mb-2">MÉTRICAS / HISTÓRICO</p>
            <h2 class="font-serif text-4xl leading-[1.1] text-vmain mb-3 tracking-tight">El tiempo también compone.</h2>
          </div>

          <!-- Indicadores Consolidados -->
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-vcard p-4 rounded-2xl shadow-sm border border-vborder transition-colors"><p class="text-[10px] text-vmuted uppercase mb-1">Capital Histórico</p><p id="met-cap" class="text-lg font-bold text-vmain">$0.00</p></div>
            <div class="bg-vcard p-4 rounded-2xl shadow-sm border border-vborder transition-colors"><p class="text-[10px] text-vmuted uppercase mb-1">Intereses Totales</p><p id="met-int" class="text-lg font-bold text-vup">$0.00</p></div>
            <div class="bg-vcard p-4 rounded-2xl shadow-sm border border-vborder transition-colors col-span-2 text-center"><p class="text-[10px] text-vmuted uppercase mb-1">P/L Total (Latente + Intereses)</p><p id="met-pl" class="text-2xl font-bold text-vmain">$0.00</p></div>
          </div>

          <!-- Gráficos -->
          <div class="bg-vcard p-5 rounded-3xl shadow-sm border border-vborder transition-colors">
            <h3 class="text-sm font-bold text-vmain mb-4">Ingresos vs Gastos</h3>
            <div class="relative h-48 w-full"><canvas id="chart-caja"></canvas></div>
          </div>

          <div class="bg-vcard p-5 rounded-3xl shadow-sm border border-vborder transition-colors">
            <h3 class="text-sm font-bold text-vmain mb-4">Distribución de Cartera</h3>
            <div class="relative h-48 w-full"><canvas id="chart-pie"></canvas></div>
          </div>

          <div class="bg-vcard p-5 rounded-3xl shadow-sm border border-vborder transition-colors">
            <h3 class="text-sm font-bold text-vmain mb-1">Ritmo de Crecimiento</h3>
            <p class="text-xs text-vmuted mb-4">Aportes acumulados vs. Intereses ganados.</p>
            <div class="relative h-48 w-full"><canvas id="chart-line"></canvas></div>
          </div>
        </div>
      `
    };
    
    const headerTitles = { 'resumen': 'Buenos días', 'caja': 'Caja diaria', 'operaciones': 'Operaciones', 'cartera': 'Cartera', 'metricas': 'Métricas' };

    function changeTab(tabName, element) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');
      document.getElementById('header-title').innerText = headerTitles[tabName];
      document.getElementById('main-content').innerHTML = views[tabName];
      
      if(tabName === 'resumen') updateResumen();
      if(tabName === 'caja') updateCaja();
      if(tabName === 'operaciones') updateOperaciones();
      if(tabName === 'cartera') updateCartera();
      if(tabName === 'metricas') updateMetricas();
    }

    async function guardarMovimiento(e) {
      e.preventDefault();
      await addRecord("caja", { fecha: document.getElementById('caja-fecha').value, tipo: document.querySelector('input[name="tipo-mov"]:checked').value, desc: document.getElementById('caja-desc').value, monto: parseFloat(document.getElementById('caja-monto').value) });
      document.getElementById('caja-desc').value = ''; document.getElementById('caja-monto').value = ''; closeModal('modal-caja');
      if(document.getElementById('header-title').innerText.includes('Buenos')) updateResumen();
      if(document.getElementById('header-title').innerText.includes('Caja')) updateCaja();
    }

    async function guardarOperacion(e) {
      e.preventDefault();
      await addRecord("operaciones", { fecha: document.getElementById('op-fecha').value, activo: document.getElementById('op-activo').value.toUpperCase().trim(), tipo: document.querySelector('input[name="op-tipo"]:checked').value, cantidad: parseFloat(document.getElementById('op-cantidad').value), precio: parseFloat(document.getElementById('op-precio').value), comision: parseFloat(document.getElementById('op-comision').value) || 0, interes: parseFloat(document.getElementById('op-interes').value) || 0 });
      document.getElementById('op-activo').value = ''; document.getElementById('op-cantidad').value = ''; document.getElementById('op-precio').value = ''; closeModal('modal-operacion');
      if(document.getElementById('header-title').innerText.includes('Operacion')) updateOperaciones();
    }

    async function eliminarOp(id) { await deleteRecord("operaciones", id); updateOperaciones(); }
    async function vaciarOperaciones() { if(confirm('¿Borrar todas las operaciones?')) { await clearStore("operaciones"); updateOperaciones(); } }

    async function updateResumen() {
      if(!db) return; const items = await getAll("caja"); let ing = 0, gas = 0, count = 0;
      items.forEach(item => { if (item.fecha.startsWith(mesActualFiltro)) { if (item.tipo === 'Ingreso') ing += item.monto; else gas += item.monto; count++; } });
      if(document.getElementById('res-balance')) {
        document.getElementById('res-balance').innerText = formatMoney(ing - gas);
        document.getElementById('res-ingresos').innerText = formatMoney(ing); document.getElementById('res-gastos').innerText = formatMoney(gas); document.getElementById('res-count').innerText = `${count} movimientos`;
      }
    }

    async function updateCaja() {
      if(!db) return; const items = await getAll("caja"); const lista = document.getElementById('caja-lista'); if(!lista) return;
      lista.innerHTML = ''; let count = 0; items.sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
      items.forEach(item => {
        if (item.fecha.startsWith(mesActualFiltro)) {
          count++; const isIng = item.tipo === 'Ingreso';
          lista.innerHTML += `<div class="bg-vcard p-4 rounded-2xl shadow-sm border border-vborder flex justify-between items-center"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full ${isIng?'bg-vup/10 text-vup':'bg-vdown/10 text-vdown'} flex items-center justify-center"><i class="fa-solid ${isIng?'fa-arrow-down-left':'fa-arrow-up-right'}"></i></div><div><p class="font-bold text-vmain text-sm">${item.desc}</p><p class="text-xs text-vmuted">${item.fecha}</p></div></div><p class="font-semibold ${isIng?'text-vup':'text-vdown'}">${isIng?'+':'-'}${formatMoney(item.monto)}</p></div>`;
        }
      });
      document.getElementById('caja-count').innerText = `${count} registros`;
      if(count===0) lista.innerHTML = `<div class="mt-8 flex flex-col items-center justify-center text-center"><div class="w-16 h-16 bg-vcard rounded-2xl shadow-sm border border-vborder flex items-center justify-center text-vaccent text-2xl mb-4"><i class="fa-solid fa-wallet"></i></div><h4 class="font-bold text-vmain mb-1">Todavía no hay movimientos</h4></div>`;
    }

    async function updateOperaciones() {
      if(!db) return; const items = await getAll("operaciones"); const lista = document.getElementById('op-lista'); if(!lista) return;
      let capital = 0, flujo = 0, interes = 0; lista.innerHTML = ''; items.sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
      items.forEach(op => {
        const total = (op.cantidad * op.precio);
        if (op.tipo === 'Compra') { capital += total + op.comision; flujo -= (total + op.comision); } else { capital -= total; flujo += (total - op.comision); }
        interes += op.interes; const isCompra = op.tipo === 'Compra';
        lista.innerHTML += `<div class="bg-vcard p-4 rounded-2xl shadow-sm border border-vborder mb-3 relative overflow-hidden"><div class="flex justify-between items-start mb-2"><div><span class="text-[10px] font-bold ${isCompra?'text-vhero bg-vhero/10':'text-vnav bg-vnav/10'} px-2 py-0.5 rounded-sm uppercase tracking-wider">${op.tipo}</span><h4 class="font-serif font-bold text-lg text-vmain mt-1">${op.activo}</h4></div><div class="text-right"><p class="font-bold text-vmain text-sm">${formatMoney(total)}</p><p class="text-[10px] text-vmuted">${formatCrypto(op.cantidad)} x ${formatMoney(op.precio)}</p></div></div><div class="flex justify-between items-end mt-3 border-t border-vborder pt-2"><p class="text-[10px] text-vmuted">${op.fecha}</p><button onclick="eliminarOp(${op.id})" class="text-vdown text-sm hover:opacity-70"><i class="fa-solid fa-trash-can"></i></button></div></div>`;
      });
      document.getElementById('op-capital').innerText = formatMoney(capital); document.getElementById('op-flujo').innerText = formatMoney(flujo); document.getElementById('op-interes').innerText = formatMoney(interes);
      if(items.length === 0) lista.innerHTML = `<div class="mt-8 flex flex-col items-center justify-center text-center"><div class="w-16 h-16 bg-vcard rounded-2xl shadow-sm border border-vborder flex items-center justify-center text-vaccent text-2xl mb-4"><i class="fa-solid fa-arrow-trend-up"></i></div><h4 class="font-bold text-vmain mb-1">Aún no hay operaciones</h4></div>`;
    }

    async function updateCartera() {
      if(!db) return; const ops = await getAll("operaciones"); const preciosArr = await getAll("precios"); const preciosMap = {}; preciosArr.forEach(p => preciosMap[p.ticker] = p.precio);
      const portafolio = {}; ops.sort((a,b) => new Date(a.fecha) - new Date(b.fecha));
      ops.forEach(op => {
        if (!portafolio[op.activo]) portafolio[op.activo] = { cantidad: 0, costoTotal: 0 }; const p = portafolio[op.activo];
        if (op.tipo === 'Compra') { p.cantidad += op.cantidad; p.costoTotal += (op.cantidad * op.precio) + op.comision; } 
        else if (op.tipo === 'Venta') { if (p.cantidad > 0) { const ppp = p.costoTotal / p.cantidad; p.cantidad -= op.cantidad; p.costoTotal -= (op.cantidad * ppp); } }
      });
      const lista = document.getElementById('cart-lista'); if(!lista) return; lista.innerHTML = '';
      let capInv = 0, valMercado = 0, posiciones = 0;
      for (const ticker in portafolio) {
        const item = portafolio[ticker]; if (item.cantidad <= 0.00001) continue; posiciones++;
        const ppp = item.costoTotal / item.cantidad; const precioActual = preciosMap[ticker] || ppp; const valorActual = item.cantidad * precioActual; const ganancia = valorActual - item.costoTotal; const isUp = ganancia >= 0; capInv += item.costoTotal; valMercado += valorActual;
        lista.innerHTML += `<div class="bg-vcard p-5 rounded-2xl shadow-sm border border-vborder"><div class="flex justify-between items-center mb-4"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-vbody border border-vborder flex items-center justify-center font-bold text-vmain text-sm shadow-sm">${ticker.slice(0,3)}</div><div><h4 class="font-serif font-bold text-lg text-vmain">${ticker}</h4><p class="text-[10px] text-vmuted uppercase">${formatCrypto(item.cantidad)} unidades</p></div></div><div class="text-right"><p class="font-bold text-vmain text-sm">${formatMoney(valorActual)}</p><div class="flex items-center justify-end gap-1 mt-1"><span class="text-[10px] font-bold ${isUp?'text-vup bg-vup/10':'text-vdown bg-vdown/10'} px-1.5 py-0.5 rounded-sm">${isUp?'+':''}${formatMoney(ganancia)}</span></div></div></div><div class="flex justify-between bg-vbody rounded-xl p-3 border border-vborder text-xs"><div><p class="text-vmuted mb-1">Precio Compra</p><p class="font-semibold text-vmain">${formatMoney(ppp)}</p></div><div class="text-right"><p class="text-vmuted mb-1">Precio Actual <i class="fa-solid fa-pen text-[9px]"></i></p><input type="number" step="any" value="${precioActual}" onchange="actualizarPrecio('${ticker}', this.value)" class="w-20 text-right bg-transparent border-b border-vmuted font-semibold text-vmain outline-none focus:border-vaccent" /></div></div></div>`;
      }
      document.getElementById('cart-capital').innerText = formatMoney(capInv); document.getElementById('cart-pos').innerText = `${posiciones} posiciones`; document.getElementById('cart-valor').innerText = formatMoney(valMercado);
      const pl = valMercado - capInv; const elPl = document.getElementById('cart-pl'); elPl.innerText = formatMoney(pl); elPl.className = `text-2xl font-semibold mb-1 ${pl>=0 ? 'text-vup' : 'text-vdown'}`;
      if(posiciones === 0) lista.innerHTML = `<div class="mt-8 flex flex-col items-center justify-center text-center"><div class="w-16 h-16 bg-vcard rounded-2xl shadow-sm border border-vborder flex items-center justify-center text-vaccent text-2xl mb-4"><i class="fa-solid fa-suitcase"></i></div><h4 class="font-bold text-vmain mb-1">Tu cartera está vacía</h4></div>`;
    }

    async function actualizarPrecio(ticker, precio) { await putRecord("precios", { ticker: ticker, precio: parseFloat(precio) || 0 }); updateCartera(); }

    // --- ACTUALIZACIÓN DE MÉTRICAS (CHART.JS) ---
    async function updateMetricas() {
      if(!db) return;
      const caja = await getAll("caja");
      const ops = await getAll("operaciones");
      const preciosArr = await getAll("precios");
      const preciosMap = {};
      preciosArr.forEach(p => preciosMap[p.ticker] = p.precio);

      // Leemos los colores del tema actual
      const style = getComputedStyle(document.body);
      const colorUp = style.getPropertyValue('--up-color').trim();
      const colorDown = style.getPropertyValue('--down-color').trim();
      const colorAccent = style.getPropertyValue('--accent').trim();
      const colorText = style.getPropertyValue('--text-main').trim();
      const colorMuted = style.getPropertyValue('--text-muted').trim();

      // 1. Gráfico Caja
      const mesesCaja = {};
      caja.forEach(i => {
        const m = i.fecha.slice(0, 7);
        if (!mesesCaja[m]) mesesCaja[m] = { ing: 0, gas: 0 };
        if (i.tipo === 'Ingreso') mesesCaja[m].ing += i.monto; else mesesCaja[m].gas += i.monto;
      });
      const labelsCaja = Object.keys(mesesCaja).sort();

      if(chartCajaInst) chartCajaInst.destroy();
      chartCajaInst = new Chart(document.getElementById('chart-caja'), {
        type: 'bar',
        data: {
          labels: labelsCaja,
          datasets: [
            { label: 'Ingresos', data: labelsCaja.map(m => mesesCaja[m].ing), backgroundColor: colorUp },
            { label: 'Gastos', data: labelsCaja.map(m => mesesCaja[m].gas), backgroundColor: colorDown }
          ]
        },
        options: { maintainAspectRatio: false, plugins: { legend: { labels: { color: colorText } } }, scales: { x: { ticks: {color: colorMuted} }, y: { ticks: {color: colorMuted} } } }
      });

      // 2. Gráfico Cartera (Doughnut) & Cálculos de Rentabilidad
      const portafolio = {};
      let capInvertido = 0;
      let interesTotal = 0;
      
      ops.sort((a,b) => new Date(a.fecha) - new Date(b.fecha)); // Orden histórico vital

      // Acumuladores mensuales para el gráfico de líneas
      const mesesOps = {};
      let capAcum = 0, intAcum = 0;

      ops.forEach(op => {
        if (!portafolio[op.activo]) portafolio[op.activo] = { cantidad: 0, costoTotal: 0 };
        const p = portafolio[op.activo];
        const montoOp = op.cantidad * op.precio;
        
        if (op.tipo === 'Compra') { 
            p.cantidad += op.cantidad; p.costoTotal += montoOp + op.comision; 
            capInvertido += montoOp + op.comision; capAcum += montoOp + op.comision;
        } else if (op.tipo === 'Venta') {
            if (p.cantidad > 0) {
                const ppp = p.costoTotal / p.cantidad;
                p.cantidad -= op.cantidad; p.costoTotal -= (op.cantidad * ppp);
            }
            capInvertido -= montoOp; capAcum -= montoOp;
        }
        interesTotal += op.interes; intAcum += op.interes;

        // Snapshot del mes para el gráfico lineal
        const m = op.fecha.slice(0, 7);
        mesesOps[m] = { cap: capAcum, int: intAcum };
      });

      let valMercado = 0;
      const labelsPie = [], dataPie = [];
      const bgColors = [colorAccent, colorUp, colorDown, '#8b5cf6', '#0ea5e9', '#f59e0b'];
      let colorIndex = 0;

      for (const ticker in portafolio) {
        const p = portafolio[ticker];
        if (p.cantidad > 0.00001) {
          labelsPie.push(ticker);
          const precioAct = preciosMap[ticker] || (p.costoTotal / p.cantidad);
          const valor = p.cantidad * precioAct;
          dataPie.push(valor);
          valMercado += valor;
        }
      }

      if(chartPieInst) chartPieInst.destroy();
      chartPieInst = new Chart(document.getElementById('chart-pie'), {
        type: 'doughnut',
        data: { labels: labelsPie, datasets: [{ data: dataPie, backgroundColor: bgColors }] },
        options: { maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: colorText } } } }
      });

      // 3. Gráfico de Líneas (Capital vs Intereses - El poder del tiempo)
      const labelsLine = Object.keys(mesesOps).sort();
      
      if(chartLineInst) chartLineInst.destroy();
      chartLineInst = new Chart(document.getElementById('chart-line'), {
        type: 'line',
        data: {
          labels: labelsLine,
          datasets: [
            { label: 'Aportes Acum.', data: labelsLine.map(m => mesesOps[m].cap), borderColor: colorText, backgroundColor: colorText, tension: 0.3 },
            { label: 'Intereses Ganados', data: labelsLine.map(m => mesesOps[m].int), borderColor: colorAccent, backgroundColor: colorAccent, tension: 0.3 }
          ]
        },
        options: { maintainAspectRatio: false, plugins: { legend: { labels: { color: colorText } } }, scales: { x: { ticks: {color: colorMuted} }, y: { ticks: {color: colorMuted} } } }
      });

      // Imprimir Indicadores
      document.getElementById('met-cap').innerText = formatMoney(capInvertido);
      document.getElementById('met-int').innerText = formatMoney(interesTotal);
      const plTotal = (valMercado - capInvertido) + interesTotal;
      const elPl = document.getElementById('met-pl');
      elPl.innerText = formatMoney(plTotal);
      elPl.className = `text-2xl font-bold ${plTotal >= 0 ? 'text-vup' : 'text-vdown'}`;
    }

    // --- CARGA CSV ---
    function parseNumberArg(val) {
      if (!val) return 0;
      let s = String(val).trim().replace(/[$ \t]/g, ''); if (!s) return 0;
      if (s.includes('.') && s.includes(',')) { if (s.indexOf('.') < s.indexOf(',')) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, ''); } 
      else if (s.includes(',')) s = s.replace(',', '.');
      return parseFloat(s) || 0;
    }
    function parseCSVLine(line, sep) {
      const res = []; let start = 0, inQ = false;
      for (let i = 0; i < line.length; i++) {
        if (line[i] === '"') inQ = !inQ;
        else if (line[i] === sep && !inQ) { let cell = line.substring(start, i).trim(); if (cell.startsWith('"') && cell.endsWith('"')) cell = cell.slice(1, -1); res.push(cell); start = i + 1; }
      }
      let last = line.substring(start).trim(); if (last.startsWith('"') && last.endsWith('"')) last = last.slice(1, -1); res.push(last); return res;
    }
    function importarCSV(event) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        const text = e.target.result; const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
        if (lines.length < 2) return alert('Archivo vacío');
        let sep = ','; if (lines[0].includes(';')) sep = ';';
        const headers = parseCSVLine(lines[0].toLowerCase(), sep);
        const iF = headers.findIndex(h => h.includes('fecha')), iA = headers.findIndex(h => h.includes('activo')), iT = headers.findIndex(h => h.includes('tipo'));
        const iC = headers.findIndex(h => h.includes('cantidad')), iP = headers.findIndex(h => h.includes('precio')), iCom = headers.findIndex(h => h.includes('comision')), iInt = headers.findIndex(h => h.includes('interes'));
        let cargados = 0;
        for (let i = 1; i < lines.length; i++) {
          const cols = parseCSVLine(lines[i], sep);
          const f = iF!==-1?cols[iF]:cols[0], a = iA!==-1?cols[iA]:cols[1], c = parseNumberArg(iC!==-1?cols[iC]:cols[3]), p = parseNumberArg(iP!==-1?cols[iP]:cols[4]);
          if (f && a && c > 0) { await addRecord("operaciones", { fecha: f.trim(), activo: a.toUpperCase().trim(), tipo: (iT!==-1?cols[iT]:cols[2]).toLowerCase().includes('vent') ? 'Venta' : 'Compra', cantidad: c, precio: p, comision: iCom!==-1 ? parseNumberArg(cols[iCom]) : 0, interes: iInt!==-1 ? parseNumberArg(cols[iInt]) : 0 }); cargados++; }
        }
        event.target.value = ''; if(document.getElementById('header-title').innerText.includes('Operacion')) updateOperaciones();
        alert(`¡Se cargaron ${cargados} operaciones!`);
      };
      reader.readAsText(file);
    }
  </script>
