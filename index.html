<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mi App Financiera</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Configuración de Colores Intercambiables -->
  <style>
    /* Tema 1: Pro Trader (Por defecto) */
    :root {
      --bg-main: #0f172a;      /* Azul medianoche */
      --bg-card: #1e293b;      /* Azul pizarra */
      --accent: #06b6d4;       /* Celeste neón */
      --accent-hover: #0891b2;
      --text-main: #f8fafc;    /* Blanco puro */
      --text-muted: #94a3b8;   /* Gris azulado */
      --color-up: #22c55e;     /* Verde brillante */
      --color-down: #ef4444;   /* Rojo vibrante */
    }

    /* Tema 3: Premium Wealth */
    body.theme-premium {
      --bg-main: #1f2229;      /* Gris carbón */
      --bg-card: #2a2e37;      /* Ónix mate */
      --accent: #f59e0b;       /* Dorado / Ámbar */
      --accent-hover: #d97706;
      --text-main: #fffff0;    /* Blanco marfil */
      --text-muted: #9ca3af;   /* Gris neutro */
      --color-up: #65a30d;     /* Verde musgo */
      --color-down: #be123c;   /* Rojo burdeos */
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.3s, color 0.3s;
    }
    
    .bg-card { background-color: var(--bg-card); transition: background-color 0.3s; }
    .text-muted { color: var(--text-muted); }
    .text-accent { color: var(--accent); }
    .bg-accent { background-color: var(--accent); }
    .border-accent { border-color: var(--accent); }
    
    /* Efecto del botón flotante */
    .fab-button {
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: transform 0.2s;
    }
    .fab-button:active { transform: scale(0.95); }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans pb-20"> <!-- pb-20 deja espacio para la barra inferior -->

  <!-- Cabecera -->
  <header class="p-5 flex justify-between items-start bg-card shadow-md rounded-b-3xl">
    <div class="pr-4">
      <h1 class="text-2xl font-bold tracking-wide mb-2">Mi Portafolio</h1>
      <p class="text-xs text-muted italic font-medium leading-relaxed">
        "La riqueza es el resultado de pequeñas decisiones consistentes tomadas a lo largo del tiempo."
      </p>
    </div>
    <!-- Botón para cambiar de Tema -->
    <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-accent flex items-center justify-center text-white shrink-0 shadow-lg">
      <i class="fa-solid fa-palette"></i>
    </button>
  </header>

  <!-- Área de Contenido Principal (Aquí irán cambiando las pantallas) -->
  <main class="flex-1 p-5" id="main-content">
    
    <!-- Pantalla de inicio de prueba -->
    <div class="flex flex-col items-center justify-center h-64 text-center">
      <i class="fa-solid fa-wallet text-6xl text-muted mb-4 opacity-50"></i>
      <h2 class="text-xl font-semibold mb-2">Pantalla de Gastos</h2>
      <p class="text-muted text-sm">Navegá con los botones de abajo para ver cómo cambian las secciones.</p>
    </div>

  </main>

  <!-- Barra de Navegación Inferior (Fija) -->
  <nav class="fixed bottom-0 w-full bg-card shadow-[0_-5px_15px_rgba(0,0,0,0.2)] flex justify-between items-center px-2 py-3 rounded-t-3xl z-40">
    
    <button onclick="changeTab('gastos', this)" class="nav-item flex-1 flex flex-col items-center text-accent transition-colors">
      <i class="fa-solid fa-money-bill-transfer text-xl mb-1"></i>
      <span class="text-[10px] font-semibold uppercase tracking-wider">Caja</span>
    </button>
    
    <button onclick="changeTab('operaciones', this)" class="nav-item flex-1 flex flex-col items-center text-muted transition-colors">
      <i class="fa-solid fa-arrow-trend-up text-xl mb-1"></i>
      <span class="text-[10px] font-semibold uppercase tracking-wider">Operar</span>
    </button>

    <!-- Espacio vacío en el medio para el Botón Flotante -->
    <div class="w-16"></div>

    <button onclick="changeTab('cartera', this)" class="nav-item flex-1 flex flex-col items-center text-muted transition-colors">
      <i class="fa-solid fa-pie-chart text-xl mb-1"></i>
      <span class="text-[10px] font-semibold uppercase tracking-wider">Cartera</span>
    </button>
    
    <button onclick="changeTab('metricas', this)" class="nav-item flex-1 flex flex-col items-center text-muted transition-colors">
      <i class="fa-solid fa-chart-simple text-xl mb-1"></i>
      <span class="text-[10px] font-semibold uppercase tracking-wider">Métricas</span>
    </button>
  </nav>

  <!-- Botón Flotante Central (Carga Rápida) -->
  <button class="fab-button fixed bottom-8 left-1/2 -translate-x-1/2 w-16 h-16 rounded-full bg-accent flex items-center justify-center text-white text-2xl z-50 border-4 border-[var(--bg-main)]">
    <i class="fa-solid fa-plus"></i>
  </button>

  <script>
    // Lógica para cambiar entre los dos temas de diseño
    function toggleTheme() {
      document.body.classList.toggle('theme-premium');
    }

    // Lógica simple para iluminar el ícono seleccionado en la barra inferior
    function changeTab(tabName, element) {
      // 1. Quitar el color "encendido" a todos los botones
      const items = document.querySelectorAll('.nav-item');
      items.forEach(item => {
        item.classList.remove('text-accent');
        item.classList.add('text-muted');
      });

      // 2. Encender el botón que tocamos
      element.classList.remove('text-muted');
      element.classList.add('text-accent');

      // (Más adelante, aquí cambiaremos el contenido de la pantalla dependiendo del tabName)
      document.getElementById('main-content').innerHTML = `
        <div class="flex flex-col items-center justify-center h-64 text-center animate-[fadeIn_0.3s_ease-out]">
          <h2 class="text-xl font-semibold mb-2">Pantalla: ${tabName.toUpperCase()}</h2>
          <p class="text-muted text-sm">Aquí armaremos el diseño de esta sección.</p>
        </div>
      `;
    }
  </script>
</body>
</html>
